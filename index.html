<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Grand Stay - gerencie seu hotel. Sem anúncios, sem compras, funciona offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grand Stay</title>
<style>
:root{--bg:#1b2340;--card:#273259;--card2:#313e70;--ink:#f4f6ff;--mute:#9aa6d6;--gold:#ffc83d;--ok:#4ade80;--bad:#fb7185;--accent:#6c8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}
header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0;letter-spacing:.5px}
.coins{font-size:22px;font-weight:700;color:var(--gold)}
.sub{font-size:12px;color:var(--mute)}
#banner{margin:0 12px 6px;padding:6px 12px;border-radius:10px;background:#7c3aed;font-size:13px;font-weight:700;text-align:center;display:none}
main{flex:1;overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch}
.lobby{background:var(--card);border-radius:16px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.queue{flex:1;font-size:24px;min-height:34px;letter-spacing:1px;display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--accent);font-weight:700;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{background:#3a4575;color:#7480b3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.room{background:var(--card);border-radius:16px;padding:10px;position:relative;overflow:hidden;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.room .t{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.room .ic{font-size:30px;text-align:center}
.room.occupied{background:#27455a}.room.dirty{background:#5a3b2f}.room.locked{opacity:.85}
.bar{height:5px;background:#0003;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.room button{padding:8px;font-size:13px}
h2{font-size:15px;margin:16px 4px 8px}
.row{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.row .i{flex:1}.row b{display:block}.row small{color:var(--mute)}
.row.done{opacity:.6}
nav{display:flex;background:var(--card);border-top:1px solid #0003}
nav button{flex:1;border-radius:0;background:none;color:var(--mute);padding:12px 2px;font-size:12px}
nav button.on{color:var(--ink);box-shadow:inset 0 -3px var(--accent)}
.pop{position:fixed;top:38%;color:var(--gold);font-weight:800;pointer-events:none;animation:up 1s forwards;text-shadow:0 1px 3px #000a}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:20px;font-size:13px;max-width:90%;text-align:center;z-index:5}
#bell{position:fixed;display:none;font-size:38px;background:none;padding:6px;z-index:4;animation:sway 1s infinite alternate;filter:drop-shadow(0 0 8px var(--gold))}
@keyframes sway{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
a{color:var(--accent)}
.tog{min-width:64px}
.tog.off{background:#3a4575;color:#9aa6d6}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🏨 Grand Stay</h1><div class="sub" id="sub"></div></div>
    <div style="text-align:right"><div class="coins" id="coins">0</div><div class="sub" id="rate"></div></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
  <nav>
    <button data-tab="hotel" class="on">🏨 Hotel</button>
    <button data-tab="staff">🛎️ Equipe</button>
    <button data-tab="build">🛠️ Obras</button>
    <button data-tab="goals">🏆 Metas</button>
    <button data-tab="more">⭐ Mais</button>
  </nav>
</div>
<button id="bell" aria-label="Sino de gorjeta">🔔</button>
<script>
'use strict';
const SAVE_KEY = 'grandstay.v1', VERSION = '1.0.0';
const N_ROOMS = 12, PER_FLOOR = 4, MAX_LV = 6, QBASE = 5;
const GUEST = {
  reg:{i:'🧳', n:'Hóspede',   m:1,   stay:8,  w:70},
  fam:{i:'👨‍👩‍👧', n:'Família',   m:1.6, stay:12, w:15},
  biz:{i:'💼', n:'Executivo', m:1.3, stay:5,  w:12},
  vip:{i:'👑', n:'VIP',       m:4,   stay:10, w:3, minLv:3},
};
const STAFF = [
  {id:'recep', name:'Recepcionista', icon:'🛎️', desc:'Faz check-in sozinha',            base:150, max:10},
  {id:'maid',  name:'Camareira',     icon:'🧹', desc:'Limpa quartos sozinha',            base:200, max:10},
  {id:'conc',  name:'Concierge',     icon:'🎩', desc:'+15% de renda por nível',          base:400, max:10},
];
const UPG = [
  {id:'lobby',  name:'Saguão ampliado', icon:'🛋️', desc:'+1 vaga na fila e +25% de chegadas', base:500,  g:2.6, max:5},
  {id:'garden', name:'Jardim',          icon:'🌳', desc:'+10% de renda por nível',            base:800,  g:2.4, max:10},
  {id:'spa',    name:'Spa',             icon:'💆', desc:'Atrai mais hóspedes VIP',            base:1500, g:2.8, max:5},
];
const ACH = [
  {id:'g10',  n:'Casa aberta',        d:'Receba 10 hóspedes',                 r:100,   c:()=>S.stats.guests>=10},
  {id:'g100', n:'Hotel movimentado',  d:'Receba 100 hóspedes',                r:500,   c:()=>S.stats.guests>=100},
  {id:'g1k',  n:'Referência na cidade',d:'Receba 1000 hóspedes',              r:5000,  c:()=>S.stats.guests>=1000},
  {id:'vip',  n:'Tapete vermelho',    d:'Receba um VIP',                      r:500,   c:()=>S.stats.vip>=1},
  {id:'max',  n:'Suíte de luxo',      d:'Deixe um quarto no nível máximo',    r:1000,  c:()=>S.rooms.some(r=>r.lv>=MAX_LV)},
  {id:'full', n:'Hotel completo',     d:'Abra todos os quartos',              r:2000,  c:()=>S.rooms.every(r=>r.lv>0)},
  {id:'team', n:'Equipe completa',    d:'Contrate os 3 funcionários',         r:800,   c:()=>STAFF.every(s=>S.staff[s.id]>0)},
  {id:'bell', n:'Ouvido atento',      d:'Pegue 5 sinos de gorjeta',           r:600,   c:()=>S.stats.bells>=5},
  {id:'star', n:'Reinauguração',      d:'Ganhe sua primeira estrela',         r:1000,  c:()=>S.stars>=1},
  {id:'m1',   n:'Primeiro milhão',    d:'Ganhe 1M de moedas em um hotel',     r:10000, c:()=>S.total>=1e6},
];
const fmt = n => n < 1e3 ? Math.floor(n)+'' : n < 1e6 ? (n/1e3).toFixed(1)+'K' : n < 1e9 ? (n/1e6).toFixed(2)+'M' : n < 1e12 ? (n/1e9).toFixed(2)+'B' : (n/1e12).toFixed(2)+'T';
const roomUnlock  = i  => Math.floor(60 * Math.pow(1.9, i));
const roomUpgrade = (lv,i) => Math.floor(40 * Math.pow(2.1, lv) * (1 + 0.25 * i));
const staffCost = (s,lv) => Math.floor(s.base * Math.pow(2.3, lv));
const upgCost   = (u,lv) => Math.floor(u.base * Math.pow(u.g, lv));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

function fresh(keep){
  const k = keep || {};
  return {
    v:2, coins:60, stars:k.stars||0, queue:['reg','reg'],
    rooms:Array.from({length:N_ROOMS},(_,i)=>({lv:i===0?1:0, st:'free', t:0, dur:0, g:'reg'})),
    staff:{recep:0,maid:0,conc:0}, upg:k.upg||{lobby:0,garden:0,spa:0},
    acc:{arr:0,rec:0,maid:0}, last:Date.now(), total:0,
    stats:k.stats||{guests:0,vip:0,bells:0}, ach:k.ach||{},
    daily:k.daily||{last:'',streak:0}, set:k.set||{sound:true,vib:true},
  };
}
let S = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(o && o.rooms){
      const f = fresh(), m = Object.assign(f, o);
      m.queue = (m.queue||[]).map(q => typeof q === 'string' && GUEST[q] ? q : 'reg');
      while(m.rooms.length < N_ROOMS) m.rooms.push({lv:0, st:'free', t:0, dur:0, g:'reg'});
      m.rooms.forEach(r => { if(!GUEST[r.g]) r.g = 'reg'; if(!r.dur) r.dur = GUEST[r.g].stay; });
      m.upg = Object.assign({lobby:0,garden:0,spa:0}, m.upg); m.stats = Object.assign({guests:0,vip:0,bells:0}, m.stats);
      m.staff = Object.assign({recep:0,maid:0,conc:0}, m.staff); m.set = Object.assign({sound:true,vib:true}, m.set);
      m.ach = m.ach || {}; m.daily = Object.assign({last:'',streak:0}, m.daily);
      return m;
    }
  }catch(e){}
  return fresh();
}
function save(){ try{ S.last = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* runtime-only state (events) */
const R = {fest:0, nextEvt:70, bell:0, nextBell:45, achT:0, snd:0};

const mult = () => (1 + 0.15 * S.staff.conc) * (1 + 0.1 * S.stars) * (1 + 0.1 * S.upg.garden);
const qMax = () => QBASE + S.upg.lobby;
const roomIncome = r => 10 * r.lv * mult() * GUEST[r.g || 'reg'].m;
const openRooms = () => S.rooms.filter(r => r.lv > 0).length;
const incomeRate = () => S.rooms.reduce((a,r) => a + (r.lv ? 10 * r.lv * mult() / 9 : 0), 0);

function pickGuest(){
  const w = Object.entries(GUEST).map(([k,g]) => [k, k === 'vip' ? g.w + 2 * S.upg.spa : g.w]);
  let x = Math.random() * w.reduce((a,b) => a + b[1], 0);
  for(const [k,v] of w){ if((x -= v) < 0) return k; }
  return 'reg';
}
function checkIn(){
  for(let qi = 0; qi < S.queue.length; qi++){
    const g = GUEST[S.queue[qi]], minLv = g.minLv || 1;
    let best = -1;
    S.rooms.forEach((r,i) => { if(r.lv >= minLv && r.st === 'free' && (best < 0 || r.lv > S.rooms[best].lv)) best = i; });
    if(best >= 0){
      const r = S.rooms[best]; r.st = 'occupied'; r.g = S.queue[qi]; r.dur = r.t = g.stay;
      S.queue.splice(qi, 1); return true;
    }
  }
  return false;
}
function clean(i){ const r = S.rooms[i]; if(r.st === 'dirty'){ r.st = 'free'; return true; } return false; }

/* ---- som e vibração ---- */
let AC;
function beep(f, d, type, v){
  if(!S.set.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.value = v || 0.05; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d || 0.1)); o.stop(AC.currentTime + (d || 0.1));
  }catch(e){}
}
const vib = ms => { if(S.set.vib && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} };
const sTap = () => { beep(520, .06); vib(8); };
const sCoin = () => { const n = performance.now(); if(n - R.snd > 120){ R.snd = n; beep(880, .08, 'triangle', .04); setTimeout(() => beep(1180, .1, 'triangle', .04), 70); } };

function step(dt){
  S.acc.arr += dt;
  const arrEvery = 6 / (1 + 0.5 * openRooms()) / (1 + 0.25 * S.upg.lobby) / (R.fest > 0 ? 2 : 1);
  while(S.acc.arr >= arrEvery){ S.acc.arr -= arrEvery; if(S.queue.length < qMax()) S.queue.push(pickGuest()); }
  if(S.staff.recep > 0){ S.acc.rec += dt; const e = 3 / S.staff.recep; while(S.acc.rec >= e){ S.acc.rec -= e; checkIn(); } }
  if(S.staff.maid > 0){ S.acc.maid += dt; const e = 3 / S.staff.maid;
    while(S.acc.maid >= e){ S.acc.maid -= e; const i = S.rooms.findIndex(r => r.st === 'dirty'); if(i >= 0) clean(i); } }
  S.rooms.forEach(r => {
    if(r.st === 'occupied'){
      r.t -= dt;
      if(r.t <= 0){
        r.st = 'dirty'; const g = roomIncome(r); S.coins += g; S.total += g; S.stats.guests++; if(r.g === 'vip') S.stats.vip++;
        pop('+' + fmt(g)); sCoin();
      }
    }
  });
  /* eventos */
  if(R.fest > 0) R.fest -= dt; else { R.nextEvt -= dt; if(R.nextEvt <= 0){ R.fest = 30; R.nextEvt = 100 + Math.random() * 80; toast('🎉 Festival na cidade! Chegadas dobradas por 30s'); beep(660, .2, 'square', .03); } }
  if(R.bell > 0) R.bell -= dt; else { R.nextBell -= dt; if(R.nextBell <= 0){ R.bell = 8; R.nextBell = 60 + Math.random() * 60; showBell(); } }
  R.achT += dt; if(R.achT >= 1){ R.achT = 0; checkAch(); }
}
function checkAch(){
  ACH.forEach(a => { if(!S.ach[a.id] && a.c()){ S.ach[a.id] = 1; S.coins += a.r; S.total += a.r; toast('🏆 ' + a.n + '  +🪙' + fmt(a.r)); beep(990, .25, 'triangle', .05); dirty = true; } });
}
function dailyBonus(){
  const t = today();
  if(S.daily.last === t) return;
  const y = new Date(Date.now() - 864e5), ys = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.daily.streak = S.daily.last === ys ? Math.min(S.daily.streak + 1, 7) : 1;
  S.daily.last = t;
  const g = 100 * S.daily.streak * (1 + S.stars);
  S.coins += g; S.total += g;
  setTimeout(() => toast('🎁 Bônus diário (dia ' + S.daily.streak + '): +🪙' + fmt(g)), 700);
}
function showBell(){
  const b = $('#bell'); b.style.left = (10 + Math.random() * 70) + '%'; b.style.top = (18 + Math.random() * 50) + '%'; b.style.display = 'block'; beep(1320, .15, 'sine', .05);
}

/* ------- UI ------- */
let tab = 'hotel', dirty = true;
const $ = s => document.querySelector(s);
function pop(t){ const d = document.createElement('div'); d.className = 'pop'; d.textContent = t; d.style.left = (25 + Math.random() * 45) + '%'; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const ICON = {free:'🛏️', dirty:'🧺'};

function render(){
  const m = $('#main');
  if(tab === 'hotel'){
    let h = '<div class="lobby"><div class="queue">' + (S.queue.length ? S.queue.map(q => '<span>' + GUEST[q].i + '</span>').join('') : '<span style="color:var(--mute);font-size:14px">sem hóspedes na fila</span>') +
            '</div><button id="ci" ' + (S.queue.length ? '' : 'disabled') + '>Check-in</button></div><div class="sub" style="margin:0 4px 4px">Fila ' + S.queue.length + '/' + qMax() + ' · VIP 👑 exige quarto ★3+</div>';
    for(let f = 0; f < N_ROOMS / PER_FLOOR; f++){
      h += '<h2>Andar ' + (f + 1) + '</h2><div class="grid">';
      for(let k = 0; k < PER_FLOOR; k++){
        const i = f * PER_FLOOR + k, r = S.rooms[i];
        if(r.lv === 0){
          const c = roomUnlock(i);
          h += `<div class="room locked"><div class="t"><span>Quarto ${i+1}</span><span>🔒</span></div><div class="ic">🚪</div><button data-unlock="${i}" ${S.coins<c?'disabled':''}>Abrir 🪙${fmt(c)}</button></div>`;
        }else{
          const c = roomUpgrade(r.lv, i);
          const up = r.lv < MAX_LV ? `<button data-up="${i}" ${S.coins<c?'disabled':''}>⬆ 🪙${fmt(c)}</button>` : '<button disabled>MÁX</button>';
          const ic = r.st === 'occupied' ? GUEST[r.g].i : ICON[r.st];
          h += `<div class="room ${r.st}" data-room="${i}"><div class="t"><span>Quarto ${i+1}</span><span>${'★'.repeat(r.lv)}</span></div><div class="ic">${ic}</div><div class="bar"><i id="b${i}"></i></div>${up}</div>`;
        }
      }
      h += '</div>';
    }
    m.innerHTML = h;
  }else if(tab === 'staff'){
    m.innerHTML = '<h2>Contrate sua equipe</h2>' + STAFF.map(s => {
      const lv = S.staff[s.id], c = staffCost(s, lv), mx = lv >= s.max;
      return `<div class="row"><div style="font-size:30px">${s.icon}</div><div class="i"><b>${s.name} · nv ${lv}</b><small>${s.desc}</small></div><button data-staff="${s.id}" ${mx||S.coins<c?'disabled':''}>${mx?'MÁX':'🪙'+fmt(c)}</button></div>`;
    }).join('');
  }else if(tab === 'build'){
    m.innerHTML = '<h2>Obras no hotel</h2>' + UPG.map(u => {
      const lv = S.upg[u.id], c = upgCost(u, lv), mx = lv >= u.max;
      return `<div class="row"><div style="font-size:30px">${u.icon}</div><div class="i"><b>${u.name} · nv ${lv}/${u.max}</b><small>${u.desc}</small></div><button data-upg="${u.id}" ${mx||S.coins<c?'disabled':''}>${mx?'MÁX':'🪙'+fmt(c)}</button></div>`;
    }).join('') + '<div class="sub" style="margin:10px 4px">As obras ficam com você mesmo depois de reinaugurar o hotel.</div>';
  }else if(tab === 'goals'){
    const n = ACH.filter(a => S.ach[a.id]).length;
    m.innerHTML = `<h2>Metas · ${n}/${ACH.length}</h2>` + ACH.map(a => `<div class="row ${S.ach[a.id]?'done':''}"><div style="font-size:26px">${S.ach[a.id]?'✅':'🏆'}</div><div class="i"><b>${a.n}</b><small>${a.d}</small></div><span style="color:var(--gold);font-weight:700">🪙${fmt(a.r)}</span></div>`).join('') +
      `<h2>Estatísticas</h2><div class="row"><div class="i"><small>Hóspedes atendidos: <b style="display:inline">${S.stats.guests}</b> · VIPs: <b style="display:inline">${S.stats.vip}</b> · Sinos: <b style="display:inline">${S.stats.bells}</b><br>Ganho neste hotel: 🪙${fmt(S.total)}</small></div></div>`;
  }else{
    const gain = Math.floor(Math.sqrt(S.total / 5000));
    m.innerHTML = `<h2>Estrelas</h2><div class="row"><div class="i"><b>Reinaugurar o hotel</b><small>Reinicia moedas, quartos e equipe. Cada estrela dá +10% de renda para sempre. Obras e metas ficam.<br>Ganho agora: <b style="display:inline">${Math.max(0,gain - S.stars)}</b> ⭐</small></div><button id="pr" ${gain<=S.stars?'disabled':''}>Reinaugurar</button></div>
    <h2>Ajustes</h2>
    <div class="row"><div class="i"><b>Som</b></div><button class="tog ${S.set.sound?'':'off'}" data-set="sound">${S.set.sound?'Ligado':'Desligado'}</button></div>
    <div class="row"><div class="i"><b>Vibração</b></div><button class="tog ${S.set.vib?'':'off'}" data-set="vib">${S.set.vib?'Ligada':'Desligada'}</button></div>
    <div class="row"><div class="i"><b>Apagar progresso</b><small>Não dá para desfazer.</small></div><button id="wipe" style="background:var(--bad)">Apagar</button></div>
    <h2>Sobre</h2><div class="row"><div class="i"><b>Grand Stay v${VERSION}</b><small>Jogo original. Sem anúncios, sem compras, sem conta. O progresso fica só neste aparelho. <a href="privacy.html" target="_blank" rel="noopener">Política de privacidade</a></small></div></div>`;
  }
  dirty = false;
}
function sig(){
  const aff = [...S.rooms.map((r,i) => r.lv ? S.coins >= roomUpgrade(r.lv, i) : S.coins >= roomUnlock(i)),
               ...STAFF.map(x => S.coins >= staffCost(x, S.staff[x.id])), ...UPG.map(u => S.coins >= upgCost(u, S.upg[u.id]))];
  return [tab, S.stars, S.rooms.map(r => r.st + r.lv + r.g).join(), aff.join(), Object.values(S.staff).join(), Object.values(S.upg).join(),
          S.queue.join(), Object.keys(S.ach).length, S.set.sound, S.set.vib, Math.floor(Math.sqrt(S.total / 5000)), tab === 'goals' ? S.stats.guests : ''].join('|');
}
function tick(){
  $('#coins').textContent = '🪙 ' + fmt(S.coins);
  $('#rate').textContent = '≈ ' + fmt(incomeRate()) + '/s';
  $('#sub').textContent = '⭐ ' + S.stars + ' estrelas · x' + mult().toFixed(2);
  const bn = $('#banner');
  if(R.fest > 0){ bn.style.display = 'block'; bn.textContent = '🎉 Festival! Chegadas x2 · ' + Math.ceil(R.fest) + 's'; } else bn.style.display = 'none';
  if(R.bell <= 0) $('#bell').style.display = 'none';
  if(tab === 'hotel') S.rooms.forEach((r,i) => { const b = $('#b'+i); if(b) b.style.width = r.st === 'occupied' ? (100 - r.t / r.dur * 100) + '%' : r.st === 'dirty' ? '100%' : '0'; });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-room]'); if(!t || t.id === 'bell') return;
  const d = t.dataset; let did = true;
  if(d.tab){ tab = d.tab; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === t)); dirty = true; }
  else if(t.id === 'ci'){ if(!checkIn()) toast('Sem quarto livre para esse hóspede!'); dirty = true; }
  else if(d.unlock != null){ const c = roomUnlock(+d.unlock); if(S.coins >= c){ S.coins -= c; S.rooms[+d.unlock].lv = 1; dirty = true; } }
  else if(d.up != null){ const i = +d.up, r = S.rooms[i], c = roomUpgrade(r.lv, i); if(S.coins >= c && r.lv < MAX_LV){ S.coins -= c; r.lv++; dirty = true; } }
  else if(d.staff){ const s = STAFF.find(x => x.id === d.staff), c = staffCost(s, S.staff[s.id]); if(S.coins >= c && S.staff[s.id] < s.max){ S.coins -= c; S.staff[s.id]++; dirty = true; } }
  else if(d.upg){ const u = UPG.find(x => x.id === d.upg), c = upgCost(u, S.upg[u.id]); if(S.coins >= c && S.upg[u.id] < u.max){ S.coins -= c; S.upg[u.id]++; dirty = true; } }
  else if(d.room != null){ if(clean(+d.room)) dirty = true; else did = false; }
  else if(d.set){ S.set[d.set] = !S.set[d.set]; dirty = true; }
  else if(t.id === 'pr'){ const g = Math.floor(Math.sqrt(S.total / 5000)); if(g > S.stars && confirm('Reinaugurar e ganhar ' + (g - S.stars) + ' estrela(s)?')){ S = fresh({stars:g, upg:S.upg, stats:S.stats, ach:S.ach, daily:S.daily, set:S.set}); dirty = true; } }
  else if(t.id === 'wipe'){ if(confirm('Apagar todo o progresso?')){ S = fresh(); dirty = true; } }
  else did = false;
  if(did) sTap();
  save();
});
$('#bell').addEventListener('click', () => {
  const g = Math.max(50, incomeRate() * 60); S.coins += g; S.total += g; S.stats.bells++; R.bell = 0; $('#bell').style.display = 'none';
  pop('+' + fmt(g)); sCoin(); vib(20); save();
});

/* progresso offline (até 2h, com 50% de eficiência; só rende pleno com recepcionista e camareira) */
(function offline(){
  const away = Math.min((Date.now() - S.last) / 1000, 7200);
  if(away > 30){
    const g = incomeRate() * away * 0.5 * (S.staff.recep && S.staff.maid ? 1 : 0.3);
    if(g >= 1){ S.coins += g; S.total += g; setTimeout(() => toast('Enquanto você estava fora: +🪙' + fmt(g)), 400); }
  }
})();
dailyBonus();

let prev = performance.now(), lastSig = '';
(function loop(now){
  const dt = Math.min((now - prev) / 1000, 1); prev = now;
  step(dt);
  const sg = sig();
  if(dirty || sg !== lastSig){ const sy = $('#main').scrollTop; render(); $('#main').scrollTop = sy; lastSig = sg; }
  tick(); requestAnimationFrame(loop);
})(prev);
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
window.addEventListener('pagehide', save);
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
