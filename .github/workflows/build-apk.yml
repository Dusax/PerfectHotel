name: Gerar APK Android
on:
  push:
    branches: [main, claude/affectionate-darwin-hqpp0w]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Montar o jogo e o projeto Android
        run: |
          npm run build:www
          npx cap add android
          npm run android:icons
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GrandStay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GrandStay-apk
          path: GrandStay.apk
      - name: Publicar link de download (Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GrandStay.apk \
            --target "$GITHUB_SHA" \
            --title "Grand Stay (APK Android)" \
            --notes "APK de teste (assinado com a chave de debug). Baixe GrandStay.apk no celular e instale." \
            --prerelease
